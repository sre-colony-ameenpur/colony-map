<style>
:root{--bg:#fff;--fg:#1a1a1a;--panel:#f6f3ee;--line:#d8d2c8;--chip:#1b7a3d;--chipfg:#fff;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--panel:#222;--line:#3a3a3a;--chip:#4cc77a;--chipfg:#0b2a16;--warn:#f0b35a}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
#app{display:flex;height:100%}
#side{width:310px;max-width:42vw;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#side h1{font-size:16px;margin:12px 12px 4px;display:flex;align-items:center;gap:10px}#side h1 img{width:40px;height:40px;border-radius:50%}#side p{margin:0 12px 8px;font-size:13px;opacity:.8}
#q{margin:0 12px 8px;padding:8px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
#list{overflow:auto;flex:1;padding:0 6px 12px}
.it{padding:7px 8px;border-radius:6px;cursor:pointer;border-bottom:1px solid var(--line)}.it:hover{background:var(--bg)}
.it small{display:block;opacity:.7}.it.no{cursor:default;color:var(--warn)}
h2{font-size:13px;margin:14px 8px 4px;color:var(--warn)}
#map{flex:1;background:#e9e6e0}
.chip{background:var(--chip);color:var(--chipfg);border-radius:4px;padding:1px 3px;font:600 10px/1.1 system-ui;text-align:center;width:84px;transform:translate(-50%,9px);box-shadow:0 0 0 1px #fff8;overflow-wrap:anywhere}
#login{margin:0 12px 8px;padding:9px;border-radius:6px;background:var(--chip);color:var(--chipfg);font-weight:600;text-align:center;cursor:pointer}
.chip{cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--chip);border:1px solid #fff;transform:translate(-50%,-50%)}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(340px,100vw);background:var(--panel);color:var(--fg);border-left:1px solid var(--line);box-shadow:-4px 0 14px #0003;transform:translateX(105%);transition:transform .2s;z-index:2000;overflow:auto;box-sizing:border-box;padding:14px}
#panel.open{transform:none}#panel h3{margin:0 28px 2px 0;font-size:17px}#panel .sub{opacity:.7;font-size:13px;margin-bottom:10px}
#panel .x{position:absolute;top:8px;right:10px;border:0;background:none;color:inherit;font-size:24px;cursor:pointer}
#panel .card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
#panel .card h4{margin:0 0 6px;font-size:15px}#panel table{width:100%;border-collapse:collapse;font-size:13px}
#panel td{padding:3px 0;vertical-align:top;border-bottom:1px solid var(--line)}#panel td:first-child{opacity:.65;width:42%;padding-right:8px}
#panel .note{font-size:12px;color:var(--warn);margin:0 0 8px}
@media(max-width:640px){#app{flex-direction:column-reverse}#side{width:auto;max-width:none;height:38%;border-right:0;border-top:1px solid var(--line)}}
</style></head>

<p id="hint">Find your name, check it sits on the right plot. Zoom in with + / pinch. Wrong or missing? Tell the Election Committee within 24 hours.</p>
<div id="login">&#128274; Login to see members</div>
<input id="q" placeholder="Search name or plot, e.g. A-12" autocomplete="off"><div id="list"></div></div>
<div id="map"></div></div>
<aside id="panel" aria-live="polite"><button class="x" aria-label="Close" title="Close">&times;</button><div id="pbody"></div></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>window.UNLOCK=async function(silent){
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const E=await (await fetch('data.enc')).json();
  for(;;){
    let pw=null;try{pw=sessionStorage.getItem('mp')}catch(e){}
    if(!pw){if(silent)return null;pw=prompt('Enter the password to see members:')}
    if(pw===null)return null;
    try{
      const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.salt),iterations:E.iter,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},k,b64(E.ct));
      try{sessionStorage.setItem('mp',pw)}catch(e){}
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(e){try{sessionStorage.removeItem('mp')}catch(_){}; if(silent)return null; alert('Wrong password, try again.')}
  }
};</script>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data.json').then(r=>r.json()).then(D=>{
  let voters=D.voters||[],unlocated=D.unlocated||[],isIn=!!D.voters;   // protected builds ship plots only; names arrive after login
  const U=2**D.maxz;                                   // 1 latlng unit = U native px at zoom 0 scale
  const ll=([x,y])=>L.latLng(-y/U,x/U);                // native px -> latlng
  const map=L.map('map',{crs:L.CRS.Simple,minZoom:0,maxZoom:D.maxz+2,zoomSnap:.5,attributionControl:false});
  const bounds=L.latLngBounds(ll([0,D.h]),ll([D.w,0]));
  L.tileLayer('tiles/{z}/{x}/{y}.jpg',{minZoom:0,maxNativeZoom:D.maxz,maxZoom:D.maxz+2,noWrap:true,bounds}).addTo(map);
  map.fitBounds(bounds);map.setMaxBounds(bounds.pad(.2));
  const at={};D.plots.forEach(p=>at[p.id]=p.at);
  let plotMarks=new Map();                             // plot id -> voters sharing it
  const index=()=>{plotMarks=new Map();voters.forEach(v=>v.ids.forEach(id=>{(plotMarks.get(id)||plotMarks.set(id,[]).get(id)).push(v)}))};
  index();
  const layer=L.layerGroup().addTo(map);
  const sel=L.layerGroup().addTo(map);
  const mark=ids=>{sel.clearLayers();ids.forEach(id=>at[id]&&L.circleMarker(ll(at[id]),{radius:26,color:'#f59e0b',weight:3,fill:false,interactive:false}).addTo(sel))};
  function draw(){                                     // only plots with a member get a marker; the boxes already carry the plot number
    layer.clearLayers();const far=map.getZoom()<D.maxz-1.5;
    plotMarks.forEach((vs,id)=>{
      const icon=far?L.divIcon({className:'',html:'<div class="dot"></div>',iconSize:[0,0]})
        :L.divIcon({className:'',html:`<div class="chip" data-id="${id}">${vs.map(v=>esc(v.name)).join(' / ')}</div>`,iconSize:[0,0]});
      L.marker(ll(at[id]),{icon,title:`${id}: ${vs.map(v=>v.name).join(', ')}`}).on('click',()=>openPanel(vs,id)).addTo(layer);
    });
  }
  const panel=document.getElementById('panel'),pbody=document.getElementById('pbody');
  function openPanel(vs,title){
    const ids=[...new Set(vs.flatMap(v=>v.ids||[]))];
    pbody.innerHTML=`<h3>Plot ${esc(title||ids.join(', ')||vs[0].plot)}</h3><div class="sub">${vs.length>1?vs.length+' members share this plot':'1 member'}${ids.length>1?' - plots '+esc(ids.join(', ')):''}</div>`
      +(vs.length>1?'<p class="note">Shared plot: counts as one vote.</p>':'')
      +vs.map(v=>`<div class="card"><h4>${esc(v.name)}</h4><table>`+v.details.map(([k,x])=>`<tr><td>${esc(k)}</td><td>${esc(x)}</td></tr>`).join('')
        +(v.ids?`<tr><td>Mapped to</td><td>${esc(v.ids.join(', '))}</td></tr>`:'<tr><td>Mapped to</td><td>Not located on the map yet</td></tr>')+'</table></div>').join('');
    panel.classList.add('open');mark(ids);
  }
  const closePanel=()=>{panel.classList.remove('open');mark([])};
  panel.querySelector('.x').onclick=closePanel;document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
  map.on('zoomend',draw);draw();
  const list=document.getElementById('list'),q=document.getElementById('q'),side=document.getElementById('side');
  const login=document.getElementById('login'),hint=document.getElementById('hint');
  const fly=id=>{if(!at[id])return;mark([id]);map.flyTo(ll(at[id]),D.maxz,{duration:.6})};
  function render(){
    const t=q.value.trim().toLowerCase().replace(/\s+/g,'');
    const m=s=>!t||s.toLowerCase().replace(/[\s]+/g,'').includes(t);
    if(!isIn){
      list.innerHTML=D.plots.filter(p=>m(p.id)).map(p=>`<div class="it" data-p="${esc(p.id)}">${esc(p.id)}</div>`).join('');return;
    }
    const a=voters.filter(v=>m(v.name+v.plot+v.ids.join('')));
    const b=unlocated.filter(v=>m(v.name+v.plot));
    list.innerHTML=a.map(v=>`<div class="it" data-i="${voters.indexOf(v)}">${esc(v.name)}<small>Plot ${esc(v.plot)} - ${esc(v.type)}</small></div>`).join('')
     +(b.length?`<h2>Not located on the map yet (${b.length})</h2>`+b.map(v=>`<div class="it no" data-u="${unlocated.indexOf(v)}" data-plot="${esc(v.plot)}">${esc(v.name)}<small>Plot ${esc(v.plot)} - ${esc(v.type)}</small></div>`).join(''):'');
  }
  list.onclick=e=>{
    const p=e.target.closest('.it[data-p]');if(p)return fly(p.dataset.p);
    const it=e.target.closest('.it[data-i]');if(!it)return;
    const v=voters[+it.dataset.i];map.flyTo(ll(v.at[0]),D.maxz,{duration:.6});openPanel(plotMarks.get(v.ids[0])||[v],v.ids[0])};
  list.addEventListener('click',e=>{const u=e.target.closest('.it.no');if(u)openPanel([unlocated[+u.dataset.u]],u.dataset.plot)});
  const enter=r=>{closePanel();voters=r.voters;unlocated=r.unlocated;isIn=true;index();draw();q.placeholder='Search name or plot, e.g. A-12';
    login.style.display='none';hint.textContent='Find your name, check it sits on the right plot. Zoom in with + / pinch. Wrong or missing? Tell the Election Committee within 24 hours.';render()};
  if(isIn||!window.UNLOCK){login.style.display='none'}
  else{
    q.placeholder='Search plot, e.g. A-12';
    hint.textContent='Showing plot numbers only. Log in to see members on the map.';
    login.onclick=async()=>{try{const r=await window.UNLOCK(false);if(r)enter(r)}catch(e){}};
    window.UNLOCK(true).then(r=>{if(r)enter(r)}).catch(()=>{});   // silent re-login if this tab already has the password
  }
  q.oninput=render;render();
  const goto=id=>{if(!at[id])return;map.setView(ll(at[id]),D.maxz,{animate:false});draw();mark([id])};
  const h=decodeURIComponent(location.hash.slice(1)).toUpperCase();if(h)goto(h);   // e.g. index.html#A-12
});
</script></body></html>
